<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>软考视频学习打卡 · 系统集成项目管理工程师</title>
    <style>
        * {
            box-sizing: border-box;
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
            margin: 0;
            padding: 0;
        }
        body {
            background: #f3f5f9;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            padding: 16px;
        }
        .container {
            max-width: 600px;
            width: 100%;
            background: white;
            border-radius: 32px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.05);
            padding: 24px 20px;
        }
        h1 {
            font-size: 1.8rem;
            font-weight: 600;
            color: #1e293b;
            margin-bottom: 8px;
        }
        .subtitle {
            color: #64748b;
            font-size: 0.9rem;
            margin-bottom: 20px;
            border-left: 4px solid #3b82f6;
            padding-left: 12px;
        }
        .progress-overall {
            background: #e9eef4;
            height: 18px;
            border-radius: 40px;
            margin: 16px 0 10px;
            overflow: hidden;
        }
        .progress-fill {
            background: linear-gradient(90deg, #3b82f6, #8b5cf6);
            height: 100%;
            width: 0%;
            border-radius: 40px;
            transition: width 0.3s ease;
        }
        .stats-row {
            display: flex;
            justify-content: space-between;
            font-size: 0.9rem;
            color: #334155;
            margin-bottom: 20px;
            flex-wrap: wrap;
            gap: 10px;
        }
        .phase-cards {
            display: flex;
            gap: 10px;
            margin-bottom: 28px;
            flex-wrap: wrap;
        }
        .phase-card {
            flex: 1;
            min-width: 100px;
            background: #f8fafc;
            border-radius: 24px;
            padding: 14px 8px;
            text-align: center;
            border: 1px solid #e2e8f0;
        }
        .phase-card.active {
            border-color: #3b82f6;
            background: #eff6ff;
        }
        .phase-name {
            font-weight: 600;
            font-size: 0.9rem;
            color: #1e293b;
            margin-bottom: 4px;
        }
        .phase-dates {
            font-size: 0.7rem;
            color: #64748b;
            margin-bottom: 8px;
        }
        .phase-progress-bg {
            background: #cbd5e1;
            height: 6px;
            border-radius: 10px;
            margin: 8px 0 4px;
            overflow: hidden;
        }
        .phase-progress-fill {
            background: #3b82f6;
            height: 100%;
            width: 0%;
            border-radius: 10px;
        }
        .phase-count {
            font-size: 0.7rem;
            color: #475569;
        }
        .date-nav {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin: 24px 0 16px;
        }
        .date-nav button {
            background: white;
            border: 1px solid #cbd5e1;
            width: 42px;
            height: 42px;
            border-radius: 30px;
            font-size: 1.2rem;
            color: #334155;
            cursor: pointer;
            transition: all 0.2s;
            box-shadow: 0 2px 6px rgba(0,0,0,0.02);
        }
        .date-nav button:active {
            background: #f1f5f9;
            transform: scale(0.95);
        }
        .date-display {
            font-weight: 600;
            font-size: 1.2rem;
            background: #f1f5f9;
            padding: 8px 20px;
            border-radius: 40px;
            color: #0f172a;
        }
        .task-card {
            background: #ffffff;
            border-radius: 32px;
            padding: 24px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.03);
            border: 1px solid #e9eef2;
            margin-bottom: 24px;
        }
        .task-date {
            font-size: 1rem;
            color: #3b82f6;
            font-weight: 500;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .task-icon {
            font-size: 1.3rem;
        }
        .task-desc {
            font-size: 1.1rem;
            line-height: 1.5;
            color: #1e293b;
            margin-bottom: 20px;
            font-weight: 500;
        }
        .check-area {
            display: flex;
            align-items: center;
            gap: 12px;
            border-top: 1px dashed #cbd5e1;
            padding-top: 18px;
        }
        .checkbox {
            width: 26px;
            height: 26px;
            border-radius: 10px;
            border: 2px solid #94a3b8;
            background: white;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: 0.1s;
            font-size: 1.2rem;
            color: white;
        }
        .checkbox.checked {
            background: #3b82f6;
            border-color: #3b82f6;
            color: white;
        }
        .check-label {
            font-size: 1rem;
            font-weight: 500;
            color: #334155;
            flex: 1;
        }
        .reset-btn {
            background: none;
            border: 1px solid #e2e8f0;
            padding: 12px 20px;
            border-radius: 40px;
            color: #64748b;
            font-size: 0.9rem;
            width: 100%;
            margin-top: 20px;
            cursor: pointer;
            transition: 0.2s;
        }
        .reset-btn:active {
            background: #f1f5f9;
        }
        .footer-note {
            font-size: 0.75rem;
            color: #94a3b8;
            text-align: center;
            margin-top: 20px;
        }
        .out-of-range {
            text-align: center;
            padding: 40px 0;
            color: #94a3b8;
            font-size: 1.1rem;
        }
    </style>
</head>
<body>
<div class="container" id="app">
    <h1>📚 软考视频学习打卡</h1>
    <div class="subtitle">系统集成项目管理工程师 · 视频精讲 + 复习冲刺</div>

    <div class="progress-overall">
        <div class="progress-fill" id="overallProgress" style="width:0%"></div>
    </div>
    <div class="stats-row">
        <span>✅ 已完成 <span id="completedCount">0</span>/<span id="totalDays">0</span> 天</span>
        <span>📅 <span id="startDateDisplay"></span> 至 <span id="endDateDisplay"></span></span>
    </div>

    <div class="phase-cards" id="phaseCards"></div>

    <div class="date-nav">
        <button id="prevDay" aria-label="前一天">←</button>
        <span class="date-display" id="currentDateLabel">2026-03-23</span>
        <button id="nextDay" aria-label="后一天">→</button>
    </div>

    <div id="taskContainer"></div>

    <button class="reset-btn" id="resetBtn">🔄 重置所有打卡数据</button>
    <div class="footer-note">每天勾选“已完成”自动保存 · 打卡成功后自动跳转下一天</div>
</div>

<script>
(function() {
    // ========== 配置 ==========
    const START_DATE = '2026-03-23';   // 从明天开始
    const END_DATE = '2026-05-22';     // 考前一天
    
    const TOPICS = [
        "项目管理概论", "整合管理", "范围管理", "进度管理", "成本管理",
        "质量管理", "资源管理", "风险管理", "采购管理", "监理基础知识",
        "法律法规和标准规范", "职业道德规范", "信息化发展", "信息技术发展",
        "信息技术服务", "信息系统架构", "软件工程", "数据工程",
        "软硬件系统集成", "信息安全工程", "案例分析"
    ];
    const DAYS_PER_TOPIC = 2;      // 每个主题学习2天
    // 阶段划分（基于主题索引）
    const PHASE1_END_IDX = 6;       // 前7个主题 → 第一阶段
    const PHASE2_END_IDX = 13;      // 第8-14个主题 → 第二阶段
    // 剩余主题 → 第三阶段
    
    // 生成日期列表
    function getDateRange(start, end) {
        const startArr = start.split('-').map(Number);
        const endArr = end.split('-').map(Number);
        const startDate = new Date(startArr[0], startArr[1]-1, startArr[2]);
        const endDate = new Date(endArr[0], endArr[1]-1, endArr[2]);
        const dates = [];
        for (let d = new Date(startDate); d <= endDate; d.setDate(d.getDate() + 1)) {
            const year = d.getFullYear();
            const month = String(d.getMonth() + 1).padStart(2, '0');
            const day = String(d.getDate()).padStart(2, '0');
            dates.push(`${year}-${month}-${day}`);
        }
        return dates;
    }
    
    const ALL_DATES = getDateRange(START_DATE, END_DATE);
    const TOTAL_DAYS = ALL_DATES.length;
    
    // 显示起止日期
    document.getElementById('startDateDisplay').innerText = START_DATE;
    document.getElementById('endDateDisplay').innerText = END_DATE;
    document.getElementById('totalDays').innerText = TOTAL_DAYS;
    
    // 根据日期生成任务描述
    function generateTaskForDate(dateStr) {
        const dayIndex = ALL_DATES.indexOf(dateStr);
        if (dayIndex === -1) return "日期不在计划范围内";
        
        const topicLearningDays = TOPICS.length * DAYS_PER_TOPIC;
        
        if (dayIndex < topicLearningDays) {
            const topicIndex = Math.floor(dayIndex / DAYS_PER_TOPIC);
            const dayInTopic = dayIndex % DAYS_PER_TOPIC;
            const topic = TOPICS[topicIndex];
            if (dayInTopic === 0) {
                return `🎥 观看视频：《${topic}》精讲 · 整理笔记`;
            } else {
                return `📖 复习+做题：《${topic}》 · 完成章节练习，整理错题`;
            }
        } else {
            const remainingDays = TOTAL_DAYS - topicLearningDays;
            const remainingIndex = dayIndex - topicLearningDays;
            if (remainingIndex < 10) {
                return `📚 综合复习 · 背诵十大知识领域口诀 · 回顾计算题公式`;
            } else if (remainingIndex < 16) {
                const mod = (remainingIndex - 10) % 2;
                if (mod === 0) {
                    return `📝 真题模考（选择题） · 限时90分钟，记录错题`;
                } else {
                    return `🔍 真题复盘 · 分析错题，强化薄弱点`;
                }
            } else {
                return `⚡ 冲刺背诵 · 考前必背10页纸 · 计算题专项 · 案例分析模板`;
            }
        }
    }
    
    // 阶段信息（基于实际日期）
    function getPhaseInfo() {
        const topicLearningDays = TOPICS.length * DAYS_PER_TOPIC;
        const phase1EndIdx = (PHASE1_END_IDX + 1) * DAYS_PER_TOPIC - 1;
        const phase2EndIdx = (PHASE2_END_IDX + 1) * DAYS_PER_TOPIC - 1;
        const phase1EndDate = ALL_DATES[Math.min(TOTAL_DAYS-1, phase1EndIdx)];
        const phase2EndDate = ALL_DATES[Math.min(TOTAL_DAYS-1, phase2EndIdx)];
        const phase3StartDate = ALL_DATES[Math.min(TOTAL_DAYS-1, phase2EndIdx + 1)];
        
        const phase1Dates = ALL_DATES.slice(0, phase1EndIdx+1);
        const phase2Dates = ALL_DATES.slice(phase1EndIdx+1, phase2EndIdx+1);
        const phase3Dates = ALL_DATES.slice(phase2EndIdx+1);
        
        return {
            phase1: { name: "第一阶段：基础学习", start: START_DATE, end: phase1EndDate, dates: phase1Dates },
            phase2: { name: "第二阶段：深入学习", start: ALL_DATES[phase1EndIdx+1], end: phase2EndDate, dates: phase2Dates },
            phase3: { name: "第三阶段：冲刺复习", start: phase3StartDate, end: END_DATE, dates: phase3Dates }
        };
    }
    
    // 存储
    const STORAGE_KEY = 'ruankao_checklist_0323';
    let completedSet = new Set();
    
    function loadCompleted() {
        const stored = localStorage.getItem(STORAGE_KEY);
        if (stored) {
            try { completedSet = new Set(JSON.parse(stored)); } catch(e) {}
        }
    }
    function saveCompleted() {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(Array.from(completedSet)));
    }
    loadCompleted();
    
    // 当前显示日期（默认今天，若不在范围内则取开始日）
    let currentDisplayDate = ALL_DATES.includes(new Date().toISOString().slice(0,10)) 
        ? new Date().toISOString().slice(0,10) 
        : START_DATE;
    
    function render() {
        // 整体进度
        const completedCount = ALL_DATES.filter(d => completedSet.has(d)).length;
        document.getElementById('completedCount').innerText = completedCount;
        document.getElementById('overallProgress').style.width = (completedCount / TOTAL_DAYS * 100) + '%';
        
        // 阶段卡片
        const phases = getPhaseInfo();
        const phaseCardsDiv = document.getElementById('phaseCards');
        phaseCardsDiv.innerHTML = '';
        [phases.phase1, phases.phase2, phases.phase3].forEach((phase, idx) => {
            const total = phase.dates.length;
            const completed = phase.dates.filter(d => completedSet.has(d)).length;
            const percent = total === 0 ? 0 : (completed / total * 100);
            const activeClass = (currentDisplayDate >= phase.start && currentDisplayDate <= phase.end) ? 'active' : '';
            const card = document.createElement('div');
            card.className = `phase-card ${activeClass}`;
            card.innerHTML = `
                <div class="phase-name">${phase.name}</div>
                <div class="phase-dates">${phase.start.slice(5)} ~ ${phase.end.slice(5)}</div>
                <div class="phase-progress-bg"><div class="phase-progress-fill" style="width:${percent}%"></div></div>
                <div class="phase-count">${completed}/${total}天</div>
            `;
            phaseCardsDiv.appendChild(card);
        });
        
        // 当前日期显示
        document.getElementById('currentDateLabel').innerText = currentDisplayDate;
        
        // 任务卡片
        const taskContainer = document.getElementById('taskContainer');
        if (!ALL_DATES.includes(currentDisplayDate)) {
            taskContainer.innerHTML = `<div class="out-of-range">📅 日期不在计划范围内</div>`;
        } else {
            const taskDesc = generateTaskForDate(currentDisplayDate);
            const isChecked = completedSet.has(currentDisplayDate);
            const checkClass = isChecked ? 'checked' : '';
            const checkMark = isChecked ? '✓' : '';
            taskContainer.innerHTML = `
                <div class="task-card">
                    <div class="task-date">
                        <span class="task-icon">📌</span> ${currentDisplayDate} 的学习任务
                    </div>
                    <div class="task-desc">${taskDesc}</div>
                    <div class="check-area">
                        <span class="checkbox ${checkClass}" id="checkBtn">${checkMark}</span>
                        <span class="check-label">标记今日已完成</span>
                    </div>
                </div>
            `;
            const checkBtn = document.getElementById('checkBtn');
            checkBtn.addEventListener('click', () => {
                // 记录点击前的状态
                const wasChecked = completedSet.has(currentDisplayDate);
                
                if (wasChecked) {
                    // 取消打卡：移除标记，不跳转
                    completedSet.delete(currentDisplayDate);
                    saveCompleted();
                    render();
                } else {
                    // 新打卡：添加标记
                    completedSet.add(currentDisplayDate);
                    saveCompleted();
                    // 自动跳转到下一天（如果存在）
                    const currentIdx = ALL_DATES.indexOf(currentDisplayDate);
                    if (currentIdx !== -1 && currentIdx + 1 < ALL_DATES.length) {
                        currentDisplayDate = ALL_DATES[currentIdx + 1];
                    }
                    render();
                }
            });
        }
        
        // 日期导航
        const prevBtn = document.getElementById('prevDay');
        const nextBtn = document.getElementById('nextDay');
        const newPrev = prevBtn.cloneNode(true);
        const newNext = nextBtn.cloneNode(true);
        prevBtn.parentNode.replaceChild(newPrev, prevBtn);
        nextBtn.parentNode.replaceChild(newNext, nextBtn);
        newPrev.addEventListener('click', () => {
            const idx = ALL_DATES.indexOf(currentDisplayDate);
            if (idx > 0) currentDisplayDate = ALL_DATES[idx - 1];
            render();
        });
        newNext.addEventListener('click', () => {
            const idx = ALL_DATES.indexOf(currentDisplayDate);
            if (idx < ALL_DATES.length - 1) currentDisplayDate = ALL_DATES[idx + 1];
            render();
        });
    }
    
    // 重置
    document.getElementById('resetBtn').addEventListener('click', () => {
        if (confirm('确定重置所有打卡记录吗？此操作不可撤销。')) {
            completedSet = new Set();
            saveCompleted();
            render();
        }
    });
    
    render();
})();
</script>
</body>
</html>
